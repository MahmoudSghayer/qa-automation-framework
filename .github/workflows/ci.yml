name: QA Automation Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 2 * * *"          # nightly regression at 02:00 UTC
  workflow_dispatch:
    inputs:
      test_marker:
        description: "Pytest marker (smoke | regression | api | ui)"
        required: false
        default: smoke
      environment:
        description: "Target env"
        required: false
        default: staging

env:
  PYTHON_VERSION: "3.12"
  TEST_ENV: ${{ github.event.inputs.environment || 'staging' }}

jobs:
  # ============================================================ lint ====
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install lint tools
        run: pip install ruff black

      - name: Ruff
        run: ruff check src tests config

      - name: Black (check only)
        run: black --check src tests config

  # ============================================================ smoke ====
  smoke:
    name: Smoke Tests (${{ matrix.browser }})
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: python -m playwright install --with-deps ${{ matrix.browser }}

      - name: Run smoke suite
        env:
          TEST_ENV: ${{ env.TEST_ENV }}
          BROWSER: ${{ matrix.browser }}
          HEADLESS: "true"
          ORANGEHRM_USERNAME: ${{ secrets.ORANGEHRM_USERNAME || 'Admin' }}
          ORANGEHRM_PASSWORD: ${{ secrets.ORANGEHRM_PASSWORD || 'admin123' }}
        run: |
          pytest -m "smoke and not slow" \
                 --reruns 2 --reruns-delay 1 \
                 -n auto \
                 --maxfail=5

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.browser }}
          path: reports/allure-results
          retention-days: 7

      - name: Upload screenshots & videos on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failures-${{ matrix.browser }}
          path: |
            reports/screenshots
            reports/videos
            reports/logs
          retention-days: 14

  # ============================================================ regression ====
  regression:
    name: Regression Tests
    needs: smoke
    if: github.event_name == 'schedule' || github.event.inputs.test_marker == 'regression'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium

      - name: Run full regression
        env:
          TEST_ENV: ${{ env.TEST_ENV }}
          HEADLESS: "true"
        run: pytest -m "regression and not slow" -n auto --reruns 2

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-regression
          path: reports/allure-results

  # ============================================================ allure ====
  allure-report:
    name: Publish Allure Report
    needs: [smoke]
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all allure artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts
          pattern: allure-results-*
          merge-multiple: true

      - name: Build & deploy Allure report to gh-pages
        uses: simple-elf/allure-report-action@v1.7
        with:
          allure_results: downloaded-artifacts
          gh_pages: gh-pages
          allure_history: allure-history
          keep_reports: 20

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
