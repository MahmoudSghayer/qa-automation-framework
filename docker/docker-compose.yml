# Run locally:
#   docker compose -f docker/docker-compose.yml up --build tests
#
# After tests finish, view the report:
#   docker compose -f docker/docker-compose.yml up allure
#   → http://localhost:5050

version: "3.9"

services:
  tests:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: qa-framework:local
    container_name: qa-framework-tests
    environment:
      TEST_ENV: ${TEST_ENV:-staging}
      BROWSER: ${BROWSER:-chromium}
      HEADLESS: "true"
      ORANGEHRM_USERNAME: ${ORANGEHRM_USERNAME:-Admin}
      ORANGEHRM_PASSWORD: ${ORANGEHRM_PASSWORD:-admin123}
    volumes:
      - ../reports:/app/reports
    command: pytest -m "${MARKER:-smoke}" -n auto

  allure:
    image: frankescobar/allure-docker-service:2.27.0
    container_name: qa-framework-allure
    ports:
      - "5050:5050"
    environment:
      CHECK_RESULTS_EVERY_SECONDS: 3
      KEEP_HISTORY: 1
    volumes:
      - ../reports/allure-results:/app/allure-results
      - ../reports/allure-report:/app/default-reports
