[project]
name = "qa-automation-framework"
version = "1.0.0"
description = "Production-grade QA automation framework: Python · Playwright · Pytest · API · DB · CI/CD"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]
keywords = ["qa", "testing", "playwright", "pytest", "automation", "sdet"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]

# ============================================================ Black ====
[tool.black]
line-length = 110
target-version = ["py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  reports
  | \.venv
  | build
)/
'''

# ============================================================ Ruff ====
[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["reports", ".venv"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific
    "PT",     # flake8-pytest-style
]
ignore = [
    "E501",   # line length handled by black
    "B008",   # function call in default argument (pytest fixtures)
    "PT011",  # pytest.raises too broad — context-dependent
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011"]              # allow asserts in tests
"conftest.py"   = ["E402"]              # sys.path manipulation before imports

[tool.ruff.lint.isort]
known-first-party = ["src", "config"]

# ============================================================ Mypy ====
[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = ["reports/", "\\.venv/"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
