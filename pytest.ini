[pytest]
minversion = 8.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s | %(levelname)-8s | %(name)s | %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
log_file = reports/logs/pytest.log
log_file_level = DEBUG

# Default options (overridable via CLI)
addopts =
    -ra
    --strict-markers
    --strict-config
    --tb=short
    --color=yes
    --alluredir=reports/allure-results
    --html=reports/pytest-html/report.html
    --self-contained-html
    --maxfail=20

# Custom markers — registered so --strict-markers passes
markers =
    smoke: critical-path checks, run on every PR (~2 min)
    regression: full coverage suite, run nightly
    ui: browser-driven tests
    api: HTTP API tests
    integration: tests spanning UI + API + DB
    db: tests that hit the database directly
    auth: authentication / session tests
    crud: create/read/update/delete flows
    negative: negative and edge-case validation
    slow: tests >30s; excluded from smoke
    flaky: known flaky, auto-retried (use sparingly)
